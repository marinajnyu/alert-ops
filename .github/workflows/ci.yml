name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.2
        env:
          POSTGRES_USER: alertops
          POSTGRES_PASSWORD: alertops
          POSTGRES_DB: alertops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alertops"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ALERTOPS_TEST_DATABASE_URL: postgresql+psycopg://alertops:alertops@localhost:5432/alertops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -c requirements-dev.lock -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
