services:
  postgres:
    image: postgres:17.2
    environment:
      POSTGRES_USER: alertops
      POSTGRES_PASSWORD: alertops
      POSTGRES_DB: alertops
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alertops -d alertops"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
